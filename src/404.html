<html lang="ja">
<head>

<meta name="robots" content="noindex">

<!-- このページだけはパスを絶対にする。CloudFront は 404 の内容を元の URL の
     ままで返すため、/foo/bar で開かれたときに相対パスだと参照先がずれる -->
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preload" href="/assets/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>

<body>

<header class="site-head">
  <a class="site-title" href="/">apkas</a>
</header>

<main class="site-main" id="main">
  <!-- Not found は飾り。見出しとして読まれるのは和文だけにする -->
  <div class="page-head">
    <p class="page-head__word" aria-hidden="true">Not found</p>
    <h1 class="page-head__title">ページが見つかりません</h1>
  </div>

  <!-- どちらの言語のページから来たかは分からないので、英語の文を添える -->

    <p>お探しのページは見つかりませんでした。アドレスが変わったか、削除された可能性があります。</p>
    <p lang="en">The page you were looking for could not be found. It may have been moved or removed.</p>
    <p>
      <a href="/">トップへ</a>
      <span aria-hidden="true">／</span>
      <a href="https://diary.apkas.net">日記へ</a>
      <span aria-hidden="true">／</span>
      <a href="/en/" hreflang="en" lang="en">English</a>
    </p>
  </div>
</main>

<footer class="footer">
  <p>© 2026 apkas</p>
</footer>

</body>
